<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>
<body>
    
    <div style="display: flex; justify-content: space-around; padding: 0px 100px;">
        <div id="allNotes">Loading...</div>
        <div>
          <input id="noteBox" type="text"/>
          <button onclick="addNote()">Submit</button>
        </div>
    </div>
    
    <script>
      
      async function getNotes(){
          const response = await axios.get("http://localhost:3000/notes");
          const notes = response.data.notes;

          const parentNode = document.getElementById("allNotes");
          parentNode.innerHTML = "";

          for(let i=0;i<notes.length;i++){
            const newNote = document.createElement("div");
            newNote.innerHTML = notes[i];
            newNote.setAttribute("style","border:2px solid black;margin:5px")
            parentNode.appendChild(newNote);
          }

      }
      getNotes();


      async function addNote(){

       // extract the usernote from the input text box
       const userNote = document.getElementById("noteBox");
        
       // send it to server
       await axios.post("http://localhost:3000/notes",{
        note:userNote.value
       })

       const parentNode = document.getElementById("allNotes");

       const newNote = document.createElement("div");
       newNote.innerHTML = userNote.value;
       newNote.setAttribute("style","border:2px solid black;margin:5px")
       parentNode.appendChild(newNote);

       userNote.value = ""

      }
     

    </script>
</body>
</html>
